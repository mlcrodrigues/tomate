<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Produtividade - MVP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

    <section class="container">
        <h1>Tomate Produtivo</h1>
        <p>Gerencie seu tempo com a técnica Pomodoro</p>
        
        <section class="timer-section">
          <div class ="timer-settings">
              <label for="work-duration">Duração do Trabalho (min):</label>
              <input type="number" id="work-duration" value="25" min="1" max="60">
              <label for="break-duration">Duração do Intervalo (min):</label>
              <input type="number" id="break-duration" value="5" min="1" max="30">
          </div>
        </section>

        <section class="clock-section">  
          <canvas id="clock-canvas" width="150" height="150"></canvas>
            <div class="analog-clock">
              <div class="clock-face">
                  <div class="hand hour-hand"></div>
                  <div class="hand minute-hand"></div>
                  <div class="hand second-hand"></div>
              </div>
            </div>
          
            <div class="pomodoro-timer" id="timer-display">
                <span id="minutes">25</span>:<span id="seconds">00</span>
            </div>
          
            <div class="controls">
              <button id="start-btn">Iniciar</button>
              <button id="pause-btn">Pausar</button>
              <button id="reset-btn">Resetar</button>
            </div>  

        </section>
    </section>

    <section class="tasks-section">
        <h2>Lista de Tarefas</h2>
        <input id="new-task-input" type="text" />
        <button id="add-task-btn">Adicionar</button>
        <ul id="tasks"></ul>
    </section>
    </section>

    
    </main>

    <script src="script.js"></script>
</body>
</html>
